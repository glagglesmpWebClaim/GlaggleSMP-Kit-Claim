name = "glagglesmp-kit-claims-api"
main = "src/index.js"
compatibility_date = "2025-12-01"

[vars]
# Replace with the exact origin shown by GitHub Pages, without a trailing slash.
SITE_ORIGIN = "https://YOUR_GITHUB_USERNAME.github.io"

[[d1_databases]]
binding = "DB"
database_name = "glagglesmp-kit-claims"
# Replace after running: npx wrangler d1 create glagglesmp-kit-claims
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[secrets]
required = ["SERVER_TOKEN"]
